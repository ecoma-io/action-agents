name: Review
description: Review a pull request as an agent — it decides what to read, verifies before it claims, and comments its findings.
author: Mai Ngọc Hóa (John Martin)

branding:
  icon: search
  color: purple

inputs:
  github-token:
    description: Token the action writes with. `secrets.GITHUB_TOKEN` is enough; the workflow's `permissions:` block is what actually bounds it.
    required: true
  api-url:
    description: Base URL of an OpenAI-compatible endpoint, e.g. https://api.openai.com/v1
    required: true
  api-key:
    description: Key for that endpoint. Leave unset for a keyless endpoint — that is a supported configuration, not a degraded one.
    required: false
  model:
    description: Model id to ask.
    required: true
  request-timeout-ms:
    description: >-
      Per-attempt timeout in milliseconds for one provider call. The attempt
      must complete the whole completion; raise it for endpoints that
      legitimately take longer than 30 seconds to answer in full.
    required: false
    default: "30000"
  config-path:
    description: Overrides `.github/action-agents/review/review.json5` / `.json`, read from the default branch. When set, only that path is read and the default locations are not consulted; a path that does not exist there is a startup error. # consumer path
    required: false
    default: ""
  max-turns:
    description: Ceiling on agent turns. Reaching it ends the review and says so; it never posts a partial review as if it were complete.
    required: false
    default: "30"
  context-window:
    description: Token budget of the configured model. The agent compacts its transcript before reaching it.
    required: false
    default: "128000"
  dry-run:
    description: Review and log, comment nothing. Defaults to false, unlike `triage` and `harmonise` — a review's only output is the comment, so defaulting it on would make the action do nothing at all.
    required: false
    default: "false"

runs:
  using: node24
  main: src/index.mjs
