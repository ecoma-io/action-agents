name: Review
description: Review a pull request as an agent — it decides what to read, verifies before it claims, and comments its findings.
author: Mai Ngọc Hóa (John Martin)

branding:
  icon: search
  color: purple

inputs:
  github-token:
    description: Token the action writes with. `secrets.GITHUB_TOKEN` is enough; the workflow's `permissions:` block is what actually bounds it.
    required: true
  api-url:
    description: Base URL of an OpenAI-compatible endpoint, e.g. https://api.openai.com/v1
    required: true
  api-key:
    description: Key for that endpoint. Leave unset for a keyless endpoint — that is a supported configuration, not a degraded one.
    required: false
  model:
    description: Model id to ask.
    required: true
  request-timeout-ms:
    description: >-
      Per-attempt timeout in milliseconds for one provider call. The attempt
      must complete the whole completion; raise it for endpoints that
      legitimately take longer than two minutes to answer in full.
    required: false
    default: "120000"
  config-path:
    description: Overrides `.github/action-agents/review/review.json5` / `.json`, read from the resolved policy source (the default branch, or a pull request's base branch). When set, only that path is read and the default locations are not consulted; a path that does not exist there is a startup error. # consumer path
    required: false
    default: ""
  max-turns:
    description: Ceiling on agent turns. Reaching it ends the review and says so; it never posts a partial review as if it were complete.
    required: false
    default: "30"
  context-window:
    description: Token budget of the configured model. The agent compacts its transcript before reaching it.
    required: false
    default: "128000"
  dry-run:
    description: Review and log, comment nothing. Defaults to false, unlike `triage` and `harmonise` — a review's only output is the comment, so defaulting it on would make the action do nothing at all.
    required: false
    default: "false"
  artifact-path:
    description: >-
      Directory inside the workspace where the machine-readable run record is
      written, as a JSON file named for the run's outcome and the reviewed
      commit. A record lands at every terminal that declares one — a published
      review, a skip, an abandonment, a dry run, and the refused or failed red
      terminals — each carrying what that terminal actually read, and the
      exact file written is published as the `artifact-file` output. The write
      never leaves the workspace. A terminal that declares no record, or whose
      record write failed, leaves no file and logs the loss.
    required: false
    default: ".review-artifact"
  gate-mode:
    description: >-
      What the review's merge gate does with its verdict. `observe` (the
      default) records the verdict on the job outputs and a neutral check
      run and blocks nothing; `required` renders the check run's conclusion
      from the verdict (`success` on PASS, `failure` on BLOCK) so a branch
      ruleset can gate on it. The action's own step never fails on BLOCK.
    required: false
    default: "observe"

outputs:
  gate-verdict:
    description: The merge gate's verdict as surfaced — `PASS` or `BLOCK` in `required` mode, `OBSERVE-PASS` or `OBSERVE-BLOCK` in `observe` mode. Present after a published review.
  sarif-path:
    description: Path to the review's SARIF projection, written under the runner's temp directory. Present after a published review whose SARIF write succeeded.
  artifact-file:
    description: Path on the runner to the machine-readable run record this run wrote — the exact file the write laid down, published at every terminal that declares a record, on a published review and on the red boundary's record alike. Empty when the terminal declares no record or the record write failed, and the run logs that it did.

runs:
  using: node24
  main: src/index.mjs
