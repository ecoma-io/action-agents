name: Harmonise
description: Keep the multilingual versions of a repository's documentation semantically in step with one another.
author: Mai Ngọc Hóa (John Martin)

branding:
  icon: book
  color: green

inputs:
  github-token:
    description: Token the action writes with. `secrets.GITHUB_TOKEN` is enough; the workflow's `permissions:` block is what actually bounds it.
    required: true
  api-url:
    description: Base URL of an OpenAI-compatible endpoint, e.g. https://api.openai.com/v1
    required: true
  api-key:
    description: Key for that endpoint. Leave unset for a keyless endpoint — that is a supported configuration, not a degraded one.
    required: false
  model:
    description: Model id to ask.
    required: true
  config-path:
    description: Overrides `.github/action-agents/harmonise/harmonise.json5` / `.json`, read from the default branch. When set, only that path is read and the default locations are not consulted; a path that does not exist there is a startup error. # consumer path
    required: false
    default: ""
  source-language:
    description: BCP 47 tag of the language that is the source of truth. Every other version is judged against it.
    required: true
  documents:
    description: Comma-separated globs narrowing which source documents this run keeps in step. Empty means all of them — the config's language map defines the space, this only filters it.
    required: false
    default: ""
  dry-run:
    description: Report drift, propose nothing. Defaults to true, because the output of a real run is a pull request against your documentation rather than a comment. Edits are never pushed to a branch directly.
    required: false
    default: "true"

runs:
  using: node24
  main: src/index.mjs
