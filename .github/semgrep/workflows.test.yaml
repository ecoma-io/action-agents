# This file is a semgrep --test fixture for workflows.yaml, not a real workflow —
# it never runs as one; nothing under .github/semgrep is a workflow trigger. The
# top-level `rules: []` key exists only so that `semgrep --config
# .github/semgrep`, which loads every .yml/.yaml file in that directory as a
# candidate rule config, sees a valid (empty) config here instead of erroring out
# with "missing keys ... 'rules'" — see the WHY in workflows.yaml's own header
# comment. The `on2:`/fake job content below it is ordinary fixture data;
# `rules: []` does not change how pattern-regex or metavariable-pattern read the
# rest of the file.
rules: []

name: fake workflow, fixture only
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ruleid: workflow-action-not-pinned-to-sha
      - uses: actions/checkout@v4
      # ok: workflow-action-not-pinned-to-sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # An expression ref is not a pin: the runner does not evaluate
      # expressions in uses (actions/runner#895) and rejects the workflow.
      # ruleid: workflow-action-not-pinned-to-sha
      - uses: ecoma-io/action-agents/triage@${{ github.sha }}
      # ruleid: workflow-action-not-pinned-to-sha
      - uses: ecoma-io/action-agents/triage@${{ github.event.pull_request.head.sha }}
      # The dogfood shape: this repository's own bytes, checked out and
      # reviewed in the diff that changes them — no upstream to repoint.
      # ok: workflow-action-not-pinned-to-sha
      - uses: ./triage

      # ok: workflow-action-not-pinned-to-sha
      # A comment containing the literal text `uses: actions/checkout@v4` must
      # not match: the structural rule parses YAML nodes and sees comments as
      # data, where a regex over the raw file would flag prose like this.

      # ruleid: workflow-expression-interpolated-into-run
      - run: echo "${{ github.event.pull_request.title }}"
      # ok: workflow-expression-interpolated-into-run
      - run: echo "${{ github.sha }}"
      # ok: workflow-expression-interpolated-into-run
      - run: echo "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
on2:
  # ruleid: workflow-pull-request-target
  pull_request_target:
    branches: [main]
