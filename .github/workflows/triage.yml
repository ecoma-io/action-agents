name: Triage

# Dogfood: this repository's own `triage` action, classifying its own
# issues and pull requests and applying the labels its own sheet declares.
# The dry-run phase is over: five real threads — three issues including an
# adversarial one, two pull requests — classified correctly with nothing
# written, the adversarial body refused, size measured from a real diff, and
# the key masked in every log line. Real runs write labels, and one marked
# comment: a no-sheet classification or, on an issue, a code-composed signal
# comment when the issue is judged incomplete or a duplicate of an open one.
# That is the whole write surface — nothing is closed, assigned or mentioned.
#
# The action is referenced as `./triage` from the checkout of the ref that
# triggered the run, which under `pull_request` is the merge commit of this
# repository's code and the pull request's — a pull request classifies
# itself with the code it carries. The trade that shape makes, stated
# rather than hidden: a pull request raised from within this repository
# runs its own triage code with the LLM gateway key in reach. A fork's pull
# request gets no secrets and a read-only token, which is exactly the
# arrangement SECURITY.md documents for `review`; the residual exposure is
# a same-repo branch, which here means a maintainer's own push. Flip
# `dry-run` to false only with that understood.

on:
  issues:
    types: [opened, edited, reopened, labeled]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]
  workflow_dispatch:

# `labeled` is the queue-marker lifecycle event (item 1 of #224): the issue
# forms apply `needs triage`, and the action classifies on `labeled` and
# clears the marker once a category is on the thread. `dry-run: false`
# below is the only reason triage fires on real threads; every other event
# in these triggers is re-triaged by the action's event matrix, and the
# label-only or non-evidence events it receives are skipped internally.

# Exactly what a real run writes and nothing more: labels on issues and
# pull requests, and the one marked comment. `contents` stays read-only —
# the config file is read, never written. The block itself is the security
# boundary, which is the point of the design: a fork's pull request gets a
# read-only token under `pull_request`, so a real run there fails loudly
# rather than silently skipping — the posture the action documents, and
# `continue-on-error` remains a workflow choice nobody has made here.
permissions:
  contents: read
  issues: write
  pull-requests: write
  # `pull-requests: write` is load-bearing even though triage only writes
  # labels: GitHub's token refuses the issues-API label write on a pull
  # request number without this scope — HTTP 403 on `/issues/N/labels`,
  # observed in run 33219882428 when the scope was briefly dropped. The
  # scope also admits endpoints triage never calls (reviews, reviewers);
  # GitHub offers no narrower scope that covers PR-thread labels, and the
  # alternative is a dogfood that fails on every pull request thread.

# One triage run per thread: a rapid sequence of edits to the same issue
# replaces the queued run rather than stacking classifications of stale
# text. Runs for different threads are independent.
concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The checkout exists so the runner can find the action at `./triage`;
      # triage itself reads everything through the API, never the working
      # tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./triage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: triage
          dry-run: false
