name: Harmonise

# Dogfood: this repository's own `harmonise` action keeping its own
# documentation's Vietnamese mirror in step with the English source. The
# action reads everything through the API — the checkout exists only so the
# runner can find the action at `./harmonise`.
#
# Phase one is dry runs: every dispatch reports what it found and proposes
# nothing. The real-run phase (dry-run=false) publishes one branch, one
# commit and one pull request; that switch is flipped deliberately after a
# dry run has been inspected, per the dogfood safety checklist.
#
# `schedule` joins only after the first real pull request has been reviewed
# and merged by a human — the trigger that keeps documentation in step
# without anyone asking.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report drift and propose nothing.
        required: false
        default: "true"
        type: string

# What a real run writes: blobs, a tree, a commit, its own branch ref, and
# the one pull request. Nothing else — no issues, no comments, no merges.
permissions:
  contents: write
  pull-requests: write

# Two harmonise runs must never mutate the branch at once; unlike triage,
# cancelling in progress would abandon half-published proposals, so queued
# runs wait instead of being cancelled.
concurrency:
  group: harmonise
  cancel-in-progress: false

jobs:
  harmonise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./harmonise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: harmonise
          source-language: en
          dry-run: ${{ inputs.dry-run || 'true' }}
