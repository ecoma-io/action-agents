name: Harmonise

# Dogfood: this repository's own `harmonise` action keeping its own
# documentation's Vietnamese mirror in step with the English source. The
# action reads everything through the API — the checkout exists only so the
# runner can find the action at `./harmonise`.
#
# The pull request this action maintains must run CI like any contributor's:
# events raised by `GITHUB_TOKEN` are suppressed by GitHub's recursion
# prevention, so a harmonise PR opened on the workflow token would sit there
# with no checks at all. The App token minted below gives the run the
# organisation App's identity, and its events start workflows the way a
# contributor's do. That identity is stronger than the permissions block
# below — the block binds only `GITHUB_TOKEN` — which is the same trade
# `release.yml` makes for the release pull request, accepted because what a
# harmonise run may write is already pinned in code: files inside the
# configured language patterns, one branch of its own naming, nothing else.
#
# The verification phase is complete: the first real pull request (README →
# README.vi.md) was inspected against the safety checklist — source
# untouched, links and badges intact, glossary preserved, structure held —
# and merged through the queue with every check green. The weekly schedule
# is what keeps the mirror in step without anyone asking; dispatch remains
# for out-of-band runs, real or dry.

on:
  schedule:
    # Weekly, an hour after the semgrep analysis run — staggered, not stacked.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report drift and propose nothing.
        required: false
        default: "true"
        type: string

# What a real run writes when it falls back to the workflow token: blobs, a
# tree, a commit, its own branch ref, and the one pull request. Nothing else
# — no issues, no comments, no merges.
permissions:
  contents: write
  pull-requests: write

# Two harmonise runs must never mutate the branch at once; unlike triage,
# cancelling in progress would abandon half-published proposals, so queued
# runs wait instead of being cancelled.
concurrency:
  group: harmonise
  cancel-in-progress: false

jobs:
  harmonise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hoisted so the App-token step's `if:` has something it is allowed to
    # read — secrets cannot be referenced directly in step conditionals. Same
    # arrangement as `release.yml`, including the fallback: empty credentials
    # skip only this step, and the token line degrades to `github.token`
    # instead of failing red.
    env:
      HARMONISE_APP_ID: ${{ secrets.ECOMA_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Mint a GitHub App token
        id: app-token
        if: env.HARMONISE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ECOMA_APP_ID }}
          private-key: ${{ secrets.ECOMA_APP_KEY }}

      - uses: ./harmonise
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: harmonise
          source-language: en
          dry-run: ${{ inputs.dry-run || 'true' }}

      # The run record — outcome, pair accounting, pull request identity — as
      # a downloadable file. `always()` keeps the record for runs whose action
      # step failed; a run that died before any record could be written
      # produced no file, and `if-no-files-found: ignore` keeps those green.
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harmonise-run-record
          path: .harmonise-record/harmonise-record-*.json
          if-no-files-found: ignore
