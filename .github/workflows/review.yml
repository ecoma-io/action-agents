name: Review

# Dogfood: this repository's own `review` action, reviewing its own pull
# requests as an agent that decides what to read.
#
# DRY-RUN IS OVER. Several real runs — an adversarial-body fixture among
# them — reviewed real diffs against the real gateway with correct anchors,
# ignored embedded instructions as data, cleared stale state honestly, and
# wrote nothing while doing it. This run publishes for real: exactly one
# marker comment per pull request, updated in place, guarded by the
# pre-publication re-read of state and head — plus the merge gate's
# `review gate` check run (#362), a code-pinned projection of the same
# canonical record (SECURITY.md's fifth ceiling). A hostile review of the
# whole surface found no path from pull-request content to anything beyond
# that one comment before this flip was made.
#
# The write surface now that the flip has landed is the marker comment and the
# gate's `review gate` check run on the pull request — no labels
# (`triage`'s job), no verdicts, no mentions — and the block below is the
# boundary that makes that true: `contents` stays
# read-only because the working tree under `pull_request` is untrusted
# input, and a fork's pull request carries neither secrets nor a write
# token, which is the arrangement SECURITY.md documents for this trigger.
#
# The run's machine-readable record stays consequence-free: it is written
# inside the workspace (`.review-artifact`, the action refuses to resolve
# outside it) and the upload step publishes it as a workflow artifact —
# visible only to whoever can already see the run. The gate's check run no
# longer merely observes: this workflow runs it in `required` mode, so a
# BLOCK verdict renders a `failure` `review gate` check run and a ruleset
# that requires the check blocks merges while findings are unresolved.
#
# Code Scanning is the one surface that leaves this repository's own pages:
# a published run's confirmed findings upload to code scanning — §8's SARIF
# column, published runs only, confirmed findings only; every
# non-published terminal uploads nothing. The upload is the workflow's
# step, never the action's: the action only writes the projection and
# surfaces `sarif-path` (the audit's §7.5 split).
#
# The action is referenced as `./review` from the checkout of the ref that
# triggered the run, which under `pull_request` is the merge preview: a pull
# request is reviewed by exactly the code it carries. The trade that shape
# makes, stated rather than hidden, matches `triage.yml`'s: a same-repo
# branch runs its own review code with the LLM gateway key in reach. Here
# that means a maintainer's own push.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # `edited` is deliberately absent — a re-worded description does not change
  # the code under review, and re-reviewing it would only churn the comment.
  # There is no workflow_dispatch: without a pull request there is nothing
  # for this action to look at.

# The workflow-level floor grants nothing; the review job below restates its
# reads and holds every write — a job-level `permissions` block REPLACES this
# one rather than merging with it (analysis.yml's rule), so a job added later
# inherits read-only instead of silently widening. The job's writes are the
# marker comment, the gate's check run, and, only after a published review,
# the code scanning upload.
permissions: read-all

# One review per pull request: a rapid push sequence replaces the queued run
# rather than stacking reviews of stale heads.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Thirty reading turns over a real provider fit comfortably in this;
    # a run that cannot finish in fifteen minutes has hit a bound and will
    # say so rather than hang.
    timeout-minutes: 15
    # Writes are the job's, stated here rather than inherited: the marker
    # comment and the gate's `review gate` check run, and — only after a
    # published review — the code scanning upload. `actions: read` is the
    # audit §7.5 consumer grant (artifact verification); the action itself
    # never needs either write.
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
      actions: read
    steps:
      # Unlike `triage`, whose reads all go through the API, `review`'s
      # subject IS the working tree — this checkout is the snapshot the tools
      # read, confined to GITHUB_WORKSPACE by the action itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - id: review
        uses: ./review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: review
          # Live: publishes one upserted marker comment plus the gate's
          # check run.
          dry-run: "false"
          # Required: the verdict lands as the `review gate` check run and
          # BLOCK renders `failure`, so a ruleset that requires the check
          # blocks merges while findings are unresolved.
          gate-mode: "required"

      # Code Scanning sees the same confirmed findings the comment renders —
      # §8's SARIF column: published runs only, confirmed findings only. A
      # published review writes the projection under `runner.temp` and
      # surfaces it as `sarif-path`, so the bare default `if:` (no
      # `always()`) uploads nothing on every other terminal — refused,
      # failed, abandoned, skipped, dry-run — and no false alarm rides on a
      # green no-write run. The explicit category keeps these alerts a
      # separate stream from `analysis.yml`'s uploads. Pinned `tag@digest`
      # like every third-party action here; Renovate bumps both halves.
      - name: Upload the review's SARIF
        if: steps.review.outputs.sarif-path != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.review.outputs.sarif-path }}
          category: review

      # The run artifact — policy, risk table, findings with verification
      # states, gate outcomes, coverage, phase log — as a downloadable file.
      # `always()` keeps the record for runs whose comment step failed, and a
      # red exit leaves its refused/failed record behind too. Runs that write
      # no file: the two carve-outs (a death before the run holds the facts
      # an artifact is built from, and a failed artifact write itself), and
      # the green dry-run skips, which suppress the record along with
      # everything else. `if-no-files-found: ignore` keeps the UPLOAD step
      # green when nothing was written — the run behind it keeps whatever
      # colour it already had.
      - name: Upload the run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-run-artifact
          path: .review-artifact/review-artifact-*.json
          if-no-files-found: ignore
