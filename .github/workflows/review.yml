name: Review

# Dogfood: this repository's own `review` action, reviewing its own pull
# requests as an agent that decides what to read.
#
# DRY-RUN IS OVER. Several real runs — an adversarial-body fixture among
# them — reviewed real diffs against the real gateway with correct anchors,
# ignored embedded instructions as data, cleared stale state honestly, and
# wrote nothing while doing it. This run publishes for real: exactly one
# marker comment per pull request, updated in place, guarded by the
# pre-publication re-read of state and head. A hostile review of the whole
# surface found no path from pull-request content to anything beyond that
# one comment before this flip was made.
#
# The write surface when that flip happens is exactly one marker comment on
# the pull request — no labels (`triage`'s job), no verdicts, no mentions —
# and the block below is the boundary that makes that true: `contents` stays
# read-only because the working tree under `pull_request` is untrusted
# input, and a fork's pull request carries neither secrets nor a write token,
# which is the arrangement SECURITY.md documents for this trigger.
#
# The one non-comment output is local to the runner: the run's
# machine-readable record is written inside the workspace (`.review-artifact`,
# the action refuses to resolve outside it) and the upload step publishes
# it as a workflow artifact. That step notifies nobody and grants nothing —
# the artifact is downloadable by whoever can already see the run.
#
# The action is referenced as `./review` from the checkout of the ref that
# triggered the run, which under `pull_request` is the merge preview: a pull
# request is reviewed by exactly the code it carries. The trade that shape
# makes, stated rather than hidden, matches `triage.yml`'s: a same-repo
# branch runs its own review code with the LLM gateway key in reach. Here
# that means a maintainer's own push.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # `edited` is deliberately absent — a re-worded description does not change
  # the code under review, and re-reviewing it would only churn the comment.
  # There is no workflow_dispatch: without a pull request there is nothing
  # for this action to look at.

# A comment is the whole write surface, and only when dry-run is off.
permissions:
  contents: read
  pull-requests: write

# One review per pull request: a rapid push sequence replaces the queued run
# rather than stacking reviews of stale heads.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Thirty reading turns over a real provider fit comfortably in this;
    # a run that cannot finish in fifteen minutes has hit a bound and will
    # say so rather than hang.
    timeout-minutes: 15
    steps:
      # Unlike `triage`, whose reads all go through the API, `review`'s
      # subject IS the working tree — this checkout is the snapshot the tools
      # read, confined to GITHUB_WORKSPACE by the action itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: review
          # Live: the write surface below is one upserted marker comment.
          dry-run: "false"

      # The run artifact — policy, risk table, findings with verification
      # states, gate outcomes, coverage, phase log — as a downloadable file.
      # `always()` keeps the record for runs whose comment step failed, and a
      # red exit leaves its refused/failed record behind too. Runs that write
      # no file: the two carve-outs (a death before the run holds the facts
      # an artifact is built from, and a failed artifact write itself), and
      # the green dry-run skips, which suppress the record along with
      # everything else. `if-no-files-found: ignore` keeps the UPLOAD step
      # green when nothing was written — the run behind it keeps whatever
      # colour it already had.
      - name: Upload the run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-run-artifact
          path: .review-artifact/review-artifact-*.json
          if-no-files-found: ignore
