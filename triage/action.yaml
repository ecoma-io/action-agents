name: Triage
description: Classify issues and pull requests and apply semantic labels drawn from a list you declare, with any OpenAI-compatible model.
author: Mai Ngọc Hóa (John Martin)

branding:
  icon: tag
  color: blue

inputs:
  github-token:
    description: Token the action writes with. `secrets.GITHUB_TOKEN` is enough; the workflow's `permissions:` block is what actually bounds it.
    required: true
  api-url:
    description: Base URL of an OpenAI-compatible endpoint, e.g. https://api.openai.com/v1
    required: true
  api-key:
    description: Key for that endpoint. Leave unset for a keyless endpoint — that is a supported configuration, not a degraded one.
    required: false
  model:
    description: Model id to ask.
    required: true
  request-timeout-ms:
    description: >-
      Per-attempt timeout in milliseconds for one provider call. The attempt
      must complete the whole completion; raise it for endpoints that
      legitimately take longer than 30 seconds to answer in full.
    required: false
    default: "30000"
  config-path:
    description: Overrides `.github/action-agents/triage/triage.json5` / `.json`, read from the default branch. When set, only that path is read and the default locations are not consulted; a path that does not exist there is a startup error. # consumer path
    required: false
    default: ""
  labels:
    description: Comma-separated subset of the label sheet declared in `.github/action-agents/triage/triage.json5`, for this call site only; a name the file does not declare is a startup error, and so is setting this with no file at all, because there is nothing to narrow; empty means no narrowing — with no file there is no sheet and the classification is written as a comment. See SECURITY.md. # consumer path
    required: false
    default: ""
  dry-run:
    description: Decide and log, write nothing. Defaults to true, so a first run cannot surprise anyone.
    required: false
    default: "true"

runs:
  using: node24
  main: src/index.mjs
